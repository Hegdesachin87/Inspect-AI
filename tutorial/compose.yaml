# Both containers use the same pinned Python image but separate filesystems.
x-workspace: &workspace
  image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
  init: true
  command: [sleep, infinity]
  working_dir: /workspace
  user: "1000:1000"
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  mem_limit: 256m
  cpus: 1
  tmpfs:
    - /workspace:rw,size=32m,uid=1000,gid=1000,mode=700
    - /tmp:rw,size=16m,uid=1000,gid=1000,mode=700

services:
  default:
    <<: *workspace
  grader:
    <<: *workspace
