services:
  default:
    image: python@sha256:02108f5d322dd89f1c9e552442c25acb0543dfdbc455693a5599624f20d9155d
    init: true
    command: [sleep, infinity]
    working_dir: /workspace
    user: '1000:1000'
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    tmpfs:
      - /workspace:rw,size=32m,uid=1000,gid=1000,mode=700
      - /tmp:rw,size=16m,uid=1000,gid=1000,mode=700
